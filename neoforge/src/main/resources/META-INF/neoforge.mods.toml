modLoader = "javafml"
loaderVersion = "*"

license = "${mod_license}"
issueTrackerURL = "${mod_github}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''${mod_description}'''
modUrl = "${mod_homepage}"
itemIcon = "suppsquared:sack_lime"

[[dependencies.${ mod_id }]]
    modId = "neoforge"
    type = "required"
    versionRange = "*"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${ mod_id }]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${ mod_id }]]
    modId = "moonlight"
    type = "required"
    versionRange = "[${moonlight_min_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${ mod_id }]]
    modId = "supplementaries"
    type = "required"
    referralUrl = "https://www.curseforge.com/minecraft/mc-mods/supplementaries"
    versionRange = "[${supplementaries_min_version},)"
    ordering = "AFTER"
    side = "BOTH"
